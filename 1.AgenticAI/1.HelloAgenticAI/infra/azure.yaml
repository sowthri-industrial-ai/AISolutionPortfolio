# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: helloagenticai
metadata:
  template: helloagenticai-phase1@0.1.0

infra:
  provider: bicep
  path: .
  module: main

services:
  agent:
    project: ..
    language: python
    host: containerapp
    docker:
      # `path` and `context` are relative to `project:` (project root, ../).
      # Phase 3 (Chainlit demo) replaces the Phase 1 placeholder Dockerfile —
      # context stays as project root so the Dockerfile can COPY both
      # framework/ and demo_fruitmarket/.
      path: demo_fruitmarket/Dockerfile
