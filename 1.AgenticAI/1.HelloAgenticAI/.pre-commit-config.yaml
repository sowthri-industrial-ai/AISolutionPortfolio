default_language_version:
  python: python3.12

# Lane discipline: scope every hook to this project's subtree so quality gates
# never touch files outside 1.AgenticAI/1.HelloAgenticAI/. Sowthri does parallel
# work in other folders; this config must not interfere.
files: ^1\.AgenticAI/1\.HelloAgenticAI/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      # mypy runs in the project's uv-managed venv (not pre-commit's ephemeral
      # one) so it sees pydantic, pytest, langgraph, openai, etc. as deps land.
      # Avoids the additional_dependencies maintenance treadmill.
      - id: mypy
        name: mypy --strict (project venv via uv)
        entry: uv --directory 1.AgenticAI/1.HelloAgenticAI run mypy --strict framework/
        language: system
        pass_filenames: false
        files: ^1\.AgenticAI/1\.HelloAgenticAI/framework/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
