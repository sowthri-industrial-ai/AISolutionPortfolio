[project]
name = "helloagenticai"
version = "0.1.0"
description = "Foundational framework for agentic AI on Azure-native infra, demonstrated with a fruit-market shopping agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sowthri Somasundaram" }]

# Phase 1: placeholder app + framework Python package skeleton.
# Phase 2: framework runtime — agent orchestration, LLM, memory, guardrails,
#         observability, evals — approved at Phase 2 kickoff (CLAUDE.md rule 4).
# Phase 3: chainlit added for the live UI demo (approved at Phase 3 kickoff).
# Phase 4: azure-ai-contentsafety + langfuse added for the input/output gate
#         and Langfuse Cloud trace ingestion (approved at Phase 4 kickoff).
dependencies = [
    # Phase 1
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Phase 2 — agent runtime
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "openai>=1.50,<3.0",
    # Phase 2 — Azure SDKs (AAD-only access via DefaultAzureCredential)
    "azure-identity>=1.19,<2.0",
    # azure-cosmos doesn't expose an [aio] extras (verified on 4.15.0:
    # `Provides-Extra: None`), unlike sibling Azure SDKs. Per CLAUDE.md
    # "Conventions" we'd normally use the extras form; aiohttp is declared
    # explicitly as the deliberate exception until upstream ships extras.
    # Tracking: https://github.com/Azure/azure-sdk-for-python/issues/46810
    "azure-cosmos>=4.7,<5.0",
    "aiohttp>=3.10,<4.0",
    "azure-keyvault-secrets>=4.9,<5.0",
    "azure-monitor-opentelemetry>=1.6,<2.0",
    # Phase 2 — schemas
    "pydantic>=2.10,<3.0",
    # Phase 3 — live UI
    "chainlit>=2.0,<3.0",
    # Phase 4 — Content Safety REST client (input + output gates) and
    # Langfuse Cloud SDK (trace/span ingestion alongside App Insights).
    # azure-ai-contentsafety has both sync and async surfaces; we use the
    # async one via `azure.ai.contentsafety.aio.ContentSafetyClient`.
    "azure-ai-contentsafety>=1.0,<2.0",
    "langfuse>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework", "demo_fruitmarket"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra", ".venv"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["B011"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
exclude = ["^\\.venv/", "^infra/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

# chainlit ships partial type info but not enough for `--strict`; every
# `cl.Message().send()` call would trip `disallow_untyped_calls`. Treat
# chainlit's symbols as Any (follow_imports = "skip") so the demo UI
# passes `mypy --strict`. Same shape as the uvicorn override above.
[[tool.mypy.overrides]]
module = ["chainlit", "chainlit.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["framework", "demo_fruitmarket", "tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"  # decorators-free async tests; pytest-asyncio
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that require deployed Azure resources (deselect with '-m \"not integration\"')",
]
