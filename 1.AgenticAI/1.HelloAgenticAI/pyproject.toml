[project]
name = "helloagenticai"
version = "0.1.0"
description = "Foundational framework for agentic AI on Azure-native infra, demonstrated with a fruit-market shopping agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sowthri Somasundaram" }]

# Phase 1 dependencies only — placeholder app + framework Python package skeleton.
# Phase 2+ dependencies (langgraph, openai, azure-identity, azure-cosmos, langfuse, etc.)
# are added at Phase 2 kickoff with explicit user approval per CLAUDE.md workflow rule 4.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra", ".venv"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["B011"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
exclude = ["^\\.venv/", "^infra/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["framework", "tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that require deployed Azure resources (deselect with '-m \"not integration\"')",
]
